name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-test:
    name: Format, Clippy, Tests & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a raised version and changelog entry (RULES.md section 8)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-version-bump.sh "origin/${{ github.base_ref }}"
          else
            scripts/check-version-bump.sh "${{ github.event.before }}"
          fi

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit, integration, property, and doc tests
        run: cargo test --all-features

      - name: Run headless VaultDrive dashboard verification
        run: cargo run --example vaultdrive_dashboard -- --headless-check

      - name: Build Rustdoc with zero warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features
