[package]
name = "dashboard-tui"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "High-performance, zero-allocation, modular Terminal User Interface (TUI) & 3-tier Dashboard Engine for Rust"
license = "MIT"
repository = "https://github.com/CeeSmag/dashboard-tui"
readme = "RULES.md"
keywords = ["tui", "terminal", "dashboard", "btop", "ansi"]
categories = ["command-line-interface", "gui", "rendering"]

[features]
default = ["crossterm", "qrcode"]
crossterm = ["dep:crossterm"]
qrcode = ["dep:qrcode"]
serde = ["dep:serde", "compact_str/serde", "bitflags/serde"]

[dependencies]
bitflags = "2.8"
compact_str = "0.8"
crossterm = { version = "0.28", optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.42"
proptest = "1.6"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Strict safety & production reliability gates
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
must_use_candidate = "deny"
